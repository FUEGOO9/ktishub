<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" stroke="#10b981" stroke-width="6" stroke-opacity="0.25" fill="none"/>
  
  <!-- Jersey Icon Shape -->
  <g transform="translate(106, 96) scale(0.6)" filter="url(#glow)">
    <path d="M150 50 L250 120 L350 50 L450 150 L380 230 L320 180 L320 440 L180 440 L180 180 L120 230 L50 150 Z" 
          fill="url(#emeraldGrad)" 
          stroke="#a7f3d0" 
          stroke-width="8" 
          stroke-linejoin="round"/>
    <!-- Collar & Details -->
    <path d="M200 50 C220 110 280 110 300 50" fill="none" stroke="#064e3b" stroke-width="14" stroke-linecap="round"/>
    <path d="M250 120 L250 240" fill="none" stroke="#064e3b" stroke-width="8" stroke-linecap="round"/>
    <!-- Number 10 on Shirt -->
    <text x="250" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#022c22" text-anchor="middle">10</text>
  </g>
</svg>
