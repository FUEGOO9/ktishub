version: '3.8'

services:
  kitshub-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitshub-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/products"]
      interval: 30s
      timeout: 5s
      retries: 3
